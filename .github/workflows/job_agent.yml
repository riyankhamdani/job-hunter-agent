name: Daily Job Hunter Execution (Jam 8 Pagi WIB)

on:
  schedule:
    - cron: '0 1 * * *'  # Jam 01:00 UTC = Jam 08:00 WIB
  workflow_dispatch:     # Tombol pemicu manual dari tab Actions di GitHub

# WAJIB: Memberikan izin ke GITHUB_TOKEN untuk push file kembali ke repo
permissions:
  contents: write

jobs:
  run-job-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install requests pyTelegramBotAPI google-genai tavily-python

      - name: Run Job Hunter Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python agent.py

      - name: Commit and Push seen_urls.json
        if: success()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_urls.json
          git diff --staged --quiet || (git commit -m "chore: persist seen_urls state [skip ci]" && git push)
